name: Memos Native Android Preview
on:
  pull_request:
    paths:
      - "clients/android/**"
      - ".github/workflows/memos-android-preview.yml"
  push:
    branches: [main]
    paths:
      - "clients/android/**"
      - ".github/workflows/memos-android-preview.yml"
permissions:
  contents: read
jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # v4 omits the obsolete SDK "tools" package that broke v3 in Nov 2026.
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.1"
      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Verify local-only manifest and native UI contract
        run: python3 clients/android/qa/verify_manifest.py
      - name: Assemble debug, JVM tests and Android lint
        run: gradle -p clients/android --no-daemon --stacktrace :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
      - name: Verify debug APK exists (not delivered or released)
        run: |
          test -s clients/android/app/build/outputs/apk/debug/app-debug.apk
          python3 clients/android/qa/verify_apk.py clients/android/app/build/outputs/apk/debug/app-debug.apk
