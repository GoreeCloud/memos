name: Qt Quick Linux preview (nonpublishing)

on:
  pull_request:
    paths:
      - 'clients/linux/Memos.qml'
      - 'clients/linux/qt_*.py'
      - 'clients/linux/requirements-qt.txt'
      - 'clients/linux/tests/test_qt_*.py'
      - '.github/workflows/qt-quick-linux-preview.yml'
  push:
    branches: [main]
    paths:
      - 'clients/linux/Memos.qml'
      - 'clients/linux/qt_*.py'
      - 'clients/linux/requirements-qt.txt'
      - 'clients/linux/tests/test_qt_*.py'
      - '.github/workflows/qt-quick-linux-preview.yml'

permissions:
  contents: read

jobs:
  api-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Compile isolated Linux client and run synthetic API tests
        run: |
          python3 -m compileall -q clients/linux/qt_api.py clients/linux/qt_app.py
          python3 -m unittest discover -s clients/linux/tests -p 'test_qt_api.py' -v

  qml-headless:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
      QT_QUICK_CONTROLS_STYLE: Basic
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install headless Linux Qt shared-library prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl1 libopengl0 libxkbcommon0 libxcb-cursor0 libfontconfig1
      - name: Install isolated official Qt for Python runtime
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check --only-binary=:all: -r clients/linux/requirements-qt.txt
          .venv/bin/python -c 'from PySide6.QtCore import qVersion; assert qVersion() == "6.12.0", qVersion()'
      - name: Load QML and verify default Linux window state without server credentials
        run: |
          timeout 40s .venv/bin/python -m unittest discover -s clients/linux/tests -p 'test_qt_runtime.py' -v
