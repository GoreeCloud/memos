name: GoreeCloud Validate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: goreecloud-validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-boundary:
    name: Repository and policy boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact source revision
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Validate GoreeCloud boundary
        run: python3 scripts/validate_goreecloud.py

      - name: Verify whitespace
        run: git diff --check

  frontend:
    name: Frontend quality and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          version: "11.0.1"

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install locked dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Lint and typecheck
        working-directory: web
        run: pnpm lint

      - name: Run frontend test suite
        working-directory: web
        run: pnpm test

      - name: Build production frontend
        working-directory: web
        run: pnpm build

      - name: Record web bundle baseline
        working-directory: web
        run: python3 ../scripts/report_web_bundle.py dist >> "$GITHUB_STEP_SUMMARY"

  rendered-browser:
    name: Rendered browser acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact source revision
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          version: "11.0.1"

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.27.0"
          cache: true
          cache-dependency-path: go.sum

      - name: Install locked web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for Playwright
        working-directory: web
        run: pnpm exec playwright install --with-deps chromium

      - name: Build embedded production frontend
        working-directory: web
        run: pnpm release

      - name: Build GoreeCloud Memos server
        run: go build -o "$RUNNER_TEMP/goreecloud-memos" ./cmd/memos

      - name: Start clean private instance
        run: |
          mkdir -p "$RUNNER_TEMP/memos-rendered"
          "$RUNNER_TEMP/goreecloud-memos"             --addr 127.0.0.1             --port 18081             --data "$RUNNER_TEMP/memos-rendered"             --trusted-proxies none             > "$RUNNER_TEMP/memos-rendered.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/memos-rendered.pid"
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:18081/readyz >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/memos-rendered.log"
          exit 1

      - name: Run rendered Chromium acceptance
        working-directory: web
        env:
          MEMOS_BROWSER_BASE_URL: http://127.0.0.1:18081
        run: pnpm test:browser

      - name: Start clean authenticated acceptance instance
        run: |
          mkdir -p "$RUNNER_TEMP/memos-rendered-authenticated"
          "$RUNNER_TEMP/goreecloud-memos" \
            --addr 127.0.0.1 \
            --port 18082 \
            --data "$RUNNER_TEMP/memos-rendered-authenticated" \
            --trusted-proxies none \
            > "$RUNNER_TEMP/memos-rendered-authenticated.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/memos-rendered-authenticated.pid"
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:18082/readyz >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/memos-rendered-authenticated.log"
          exit 1

      - name: Run authenticated Chromium acceptance
        working-directory: web
        env:
          MEMOS_BROWSER_AUTHENTICATED_BASE_URL: http://127.0.0.1:18082
        run: pnpm test:browser:authenticated

      - name: Upload rendered acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rendered-browser-${{ github.sha }}
          path: |
            web/test-results/browser
            web/test-results/browser-authenticated
          if-no-files-found: error
          retention-days: 14

      - name: Show server logs on failure
        if: failure()
        run: |
          cat "$RUNNER_TEMP/memos-rendered.log"
          if test -f "$RUNNER_TEMP/memos-rendered-authenticated.log"; then
            cat "$RUNNER_TEMP/memos-rendered-authenticated.log"
          fi

      - name: Stop rendered acceptance server
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/memos-rendered.pid"; then
            kill "$(cat "$RUNNER_TEMP/memos-rendered.pid")" 2>/dev/null || true
          fi
          if test -f "$RUNNER_TEMP/memos-rendered-authenticated.pid"; then
            kill "$(cat "$RUNNER_TEMP/memos-rendered-authenticated.pid")" 2>/dev/null || true
          fi

  database-upgrade-matrix:
    name: Database upgrade (${{ matrix.driver }})
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        driver:
          - sqlite
          - mysql
          - postgres
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact source revision
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.27.0"
          cache: true
          cache-dependency-path: go.sum

      - name: Run critical migration and upgrade acceptance
        env:
          DRIVER: ${{ matrix.driver }}
        run: ./scripts/run_database_upgrade_acceptance.sh

  backend:
    name: Backend privacy and build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.27.0"
          cache: true
          cache-dependency-path: go.sum

      - name: Verify Go formatting and module graph
        run: |
          test -z "$(gofmt -l store/migrator.go server/test/startup_test.go)"
          cp go.mod /tmp/go.mod.before
          cp go.sum /tmp/go.sum.before
          go mod tidy -go=1.27.0
          cmp -s go.mod /tmp/go.mod.before
          cmp -s go.sum /tmp/go.sum.before

      - name: Run private-first startup acceptance
        run: go test ./server/test -run 'TestStartupInitializesPrivateAccessOnce|TestStartupPrivateInstanceGatewayPolicy' -count=1

      - name: Vet backend
        run: go vet ./...

      - name: Run backend test suite
        run: go test ./...

      - name: Build backend
        run: go build ./cmd/memos
