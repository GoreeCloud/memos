[package]
name = "goreecloud-memos-client"
version = "0.1.4"
description = "First-party Linux and Android client for GoreeCloud Memos"
authors = ["GoreeCloud"]
edition = "2024"
license = "MIT"
homepage = "https://memos.goreecloud.com"
repository = "https://github.com/GoreeCloud/goreecloud-memos"

[lib]
name = "goreecloud_memos_client"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = [] }
