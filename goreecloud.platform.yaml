schema_version: "2.0"

component:
  type: application
  id: goreecloud-memos
  product_name: GoreeCloud Memos
  repository: GoreeCloud/memos

lifecycle: forge
lifecycle_metadata:
  deployment_state: development
  qualification_state: not-qualified
  next_gate: seal
  candidate_identity:
    source_revision: null
    review_identity: null
    build_identity: null
    artifact_digest: null
    rollback_target: null
  evidence:
    - README.md
    - docs/PROJECT-SPECIFICATIONS.md
    - docs/PROJECT-RECORD.md
    - docs/IMPLEMENTED-FEATURES.md
    - docs/PLANNED-FEATURES.md
    - docs/VALIDATION.md
    - docs/DATABASE-COMPATIBILITY.md
    - docs/EVERKEEP-INTEGRATION.md
    - docs/PRIVACY-SHIELD-INTEGRATION.md
    - provenance/upstream.json
    - provenance/glaze.json
    - provenance/branding.json
    - provenance/privacy-shield.json
    - provenance/observability.json

version: "0.1.0-dev"

supported_platforms:
  - web
  - linux
  - container

api:
  versions:
    - v1
  endpoints:
    - name: Memos API
      url: /api/v1
      purpose: Inherited same-origin notes, users, settings, attachments, and administration API surface.

platform_systems:
  manager:
    result: applicable-blocked
    version: null
    evidence:
      - docs/MANAGER-INTEGRATION.md
      - docs/PLANNED-FEATURES.md
      - goreecloud.platform.yaml
    notes: Memos has truthful lifecycle metadata plus /healthz liveness and /readyz database readiness, but the canonical downstream application registration/lifecycle-visibility contract does not yet exist. GoreeCloud/manager#111 tracks that dependency. Memos must not invent a local registration schema; Manager runtime visibility and operational acceptance remain open.
  privacy_shield:
    result: applicable-migration-required
    version: "2.0.0"
    evidence:
      - docs/PRIVACY.md
      - docs/PRIVACY-SHIELD-INTEGRATION.md
      - integrations/privacy-shield/adapter.json
      - integrations/privacy-shield/acceptance.json
      - provenance/privacy-shield.json
      - core/memoexport/doc.go
      - store/memo_delete_policy.go
    notes: The Memos application-privacy adapter is centrally registered in Privacy Shield through PR #180 / main 96213c9b415ba132ded7c65778be04b38da79ff4 for telemetry minimization, data minimization, deletion controls, and portable export. Exact-runtime acceptance, Privacy Shield policy/status transport, privacy-status production, production approval, and lifecycle promotion remain open.
  wardveil_security:
    result: applicable-blocked
    version: null
    evidence: [docs/SECURITY.md]
    notes: Source hardening is active; Wardveil runtime protection and production security acceptance remain open.
  everkeep:
    result: applicable-migration-required
    version: "0.5.0"
    evidence:
      - docs/EVERKEEP-INTEGRATION.md
      - integrations/everkeep/adoption.json
      - integrations/everkeep/acceptance.json
      - internal/everkeep/status.go
      - internal/everkeep/status_test.go
    notes: A fail-closed source-level normalized continuity-status consumer boundary is implemented against the reviewed Everkeep contracts. Live provider connectivity, full approved backup scope, clean-target full-instance restore, target-runtime acceptance, and production recovery acceptance remain open.
  glaze_ui:
    result: applicable-migration-required
    version: "1.7.0"
    evidence:
      - docs/GLAZE-ADOPTION.md
      - provenance/glaze.json
      - web/src/themes/goreecloud.css
      - web/public/goreecloud/glaze/css/glaze-v1.4.1.css
      - web/public/goreecloud/glaze/js/glaze-v1.7.0.mjs
    notes: The rebuild applies current Glaze-aligned application presentation, but fresh repository-local rendered, accessibility, responsive, performance, rollback, and human visual acceptance remain required.
  mesh:
    result: applicable-blocked
    version: null
    evidence: [docs/PLANNED-FEATURES.md]
    notes: Capability registration and authenticated Mesh integration remain open. GoreeCloud/mesh#51 tracks the missing canonical Observability evidence-producer path; Memos must not invent an unsupported producer or authority-domain mapping.
    capabilities: []
    dependencies: []
    published_events: []
    consumed_events: []
  identity:
    result: applicable-blocked
    version: null
    evidence: [docs/SECURITY.md, docs/PLANNED-FEATURES.md]
    notes: Existing local/OIDC account support is inherited; authoritative GoreeCloud Identity integration remains open. GoreeCloud/identity#3 tracks the missing first-party application session/user-context contract; Memos must not treat inherited local/OIDC accounts as authoritative GoreeCloud Identity integration.
  policy:
    result: applicable-blocked
    version: null
    evidence: [docs/PLANNED-FEATURES.md]
    notes: GoreeCloud Policy runtime decisions and enforcement remain open. GoreeCloud/policy#3 tracks the missing authenticated application evaluation/enforcement contract; Memos must not treat the unauthenticated Development reference endpoint as production policy authority.
  observability:
    result: applicable-migration-required
    version: "0.1.0-dev"
    evidence:
      - docs/OBSERVABILITY-INTEGRATION.md
      - integrations/observability/producer.json
      - integrations/observability/acceptance.json
      - provenance/observability.json
      - internal/observability/signal.go
      - internal/observability/signal_test.go
    notes: A privacy-minimized source-level producer boundary emits canonical process-liveness and database-readiness signal objects against the reviewed Observability v1 schemas. Live collector transport, producer authentication, durable telemetry, target-runtime acceptance, and production approval remain open.

health:
  health_endpoint: /healthz
  readiness_endpoint: /readyz

continuity:
  backup:
    required: true
    requirements:
      - Protect the database, attachments, and required durable deployment configuration.
      - Exclude reusable secrets from ordinary portable backup bundles.
      - Validate restore in a clean target before recovery claims.
  restore:
    required: true
    requirements:
      - Restore notes, relationships, tags, spaces, attachments, and user-owned settings without silent loss.
  export:
    required: true
    requirements:
      - Preserve upstream open Memos export capabilities and GoreeCloud portability requirements.
  portability:
    required: true
    requirements:
      - Preserve self-hosted operation without a mandatory GoreeCloud-hosted control plane.
      - Maintain documented upstream-to-fork and fork-to-future-version migration paths.

external_dependencies:
  - name: Memos upstream
    purpose: Maintained-fork upstream source and security/update stream.
    required: true
    version_constraint: "v0.31.0 baseline"
  - name: Glaze UI
    purpose: GoreeCloud design and experience authority.
    required: true
    version_constraint: "1.7.0"

compatibility:
  platform_contract: "2.0"
  glaze_ui_required: "1.7.0"
  requires:
    - goreecloud-platform-contract==2.0
    - glaze-ui==1.7.0
  provides:
    - goreecloud-memos-quick-capture

evidence:
  acceptance_tests: []
  release: []

conformance:
  status: nonconformant
  validated_at: null
  evidence:
    - docs/VALIDATION.md
    - docs/DATABASE-COMPATIBILITY.md
    - docs/SECURITY.md
    - docs/PRIVACY.md
    - docs/PRIVACY-SHIELD-INTEGRATION.md
    - docs/GLAZE-ADOPTION.md
    - docs/OBSERVABILITY-INTEGRATION.md
  blockers:
    - Fresh Glaze V1.7 repository-local acceptance is incomplete.
    - Integral Platform System runtime integrations remain incomplete; Everkeep, Privacy Shield, and Observability currently have source-level adoption/producer boundaries only, without accepted live/runtime provider paths or production approval.
    - Representative browser, accessibility, recovery, upgrade, rollback, and production acceptance remain incomplete.
    - Production signing, release, Seal, and Anchor qualification are incomplete.
